# dev.compose.yml

name: airlock-arena-dev

services:
  arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airlock-arena-dev-api
    image: airlock-arena-dev-api:latest
    command:
      - sh
      - -c
      - "uv sync --frozen && exec uv run uvicorn
         airlock.arena.app:build_arena --factory
         --host 0.0.0.0 --port 8000 --reload"
    environment:
      - CI=true
      - AIRLOCK_AUDIT_PATH=${AIRLOCK_AUDIT_PATH:-}
      - AIRLOCK_BYPASS_PATH=${AIRLOCK_BYPASS_PATH:-}
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - arena_dev_state:/var/lib/airlock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - arena

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/vite.dev
    container_name: airlock-arena-dev-ui
    command:
      - sh
      - -c
      - "pnpm install && exec pnpm dev --host 0.0.0.0"
    environment:
      - CI=true
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-airlock arena}
      - VITE_SITE_URL=${VITE_SITE_URL:-}
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    networks:
      - arena

  nginx:
    image: nginx:1.27-alpine
    container_name: airlock-arena-dev-nginx
    ports:
      - "127.0.0.1:${AIRLOCK_UI_DEV_PORT:-61878}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/dev.nginx:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      arena:
        condition: service_healthy
    networks:
      - arena

networks:
  arena:
    driver: bridge

volumes:
  frontend_modules:
  arena_dev_state:
